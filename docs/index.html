<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent Toolbox — AI Agent Tools & Skills Search</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #263449;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --badge-bg: #0f172a;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f8fafc;
        --surface: #ffffff;
        --surface-hover: #f1f5f9;
        --border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #475569;
        --accent: #0284c7;
        --accent-soft: rgba(2, 132, 199, 0.10);
        --badge-bg: #f1f5f9;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Pretendard", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    .container {
      max-width: 1120px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }
    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      margin: 0 0 6px;
      font-size: 1.85rem;
      letter-spacing: -0.02em;
    }
    .subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 0.96rem;
    }
    .header-links {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    .btn-link, .lang-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 13px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      text-decoration: none;
      font-size: 0.86rem;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-link:hover, .lang-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
    .lang-btn.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 700;
    }
    .search-box-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    #searchInput {
      width: 100%;
      padding: 14px 44px 14px 18px;
      font-size: 1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    #searchInput:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .kbd-hint {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.78rem;
      color: var(--text-muted);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 2px 7px;
      pointer-events: none;
    }
    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .pill {
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.84rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .pill:hover {
      border-color: var(--accent);
      color: var(--text);
    }
    .pill.active {
      background: var(--accent-soft);
      border-color: var(--accent);
      color: var(--accent);
      font-weight: 600;
    }
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin: 14px 0 18px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .type-select {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.86rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 14px;
    }
    .card {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px 18px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: border-color 0.15s, transform 0.12s;
    }
    .card:hover {
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .card-title {
      margin: 0;
      font-size: 1.04rem;
      font-weight: 700;
    }
    .card-title a {
      color: var(--text);
      text-decoration: none;
    }
    .card-title a:hover {
      color: var(--accent);
      text-decoration: underline;
    }
    .type-badge {
      flex-shrink: 0;
      font-size: 0.74rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: var(--badge-bg);
      border: 1px solid var(--border);
      color: var(--accent);
      font-weight: 600;
    }
    .card-desc {
      margin: 0 0 12px;
      font-size: 0.9rem;
      color: var(--text-muted);
    }
    .card-footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }
    .tag {
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--badge-bg);
      color: var(--text-muted);
      cursor: pointer;
    }
    .tag:hover {
      color: var(--accent);
    }
    .links {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .links a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    .links a:hover {
      text-decoration: underline;
    }
    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
      border: 1px dashed var(--border);
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>🧰 Agent Toolbox</h1>
        <p id="subtitle" class="subtitle"></p>
      </div>
      <div class="header-links">
        <button id="langEnBtn" class="lang-btn" type="button">EN</button>
        <button id="langKoBtn" class="lang-btn" type="button">한국어</button>
        <a id="repoLink" class="btn-link" href="https://github.com/godstale/Agent-Toolbox" target="_blank" rel="noopener">GitHub</a>
        <a id="blogLink" class="btn-link" href="https://godstale.mycafe24.com/?p=1115" target="_blank" rel="noopener">Blog Hub</a>
      </div>
    </header>

    <div class="search-box-wrap">
      <input id="searchInput" type="search" autocomplete="off" />
      <span class="kbd-hint">/</span>
    </div>

    <div id="categoryFilters" class="filters"></div>

    <div class="meta-bar">
      <span id="resultCount">Loading...</span>
      <div>
        <label id="typeLabel" for="typeSelect">Type: </label>
        <select id="typeSelect" class="type-select"></select>
      </div>
    </div>

    <div id="grid" class="grid"></div>
  </div>

  <script>
    let allData = null;
    let selectedCat = "all";
    let selectedType = "all";
    let lang = "en";

    const UI = {
      en: {
        title: "Agent Toolbox — AI Agent Tools & Skills Search",
        subtitle: "Instant search directory for AI agent open-source projects, skills, MCP servers, and apps",
        placeholder: "Search by tool name, description, tag, or category (e.g., Claude Code, MCP, Sprite, OCR, Security)...",
        repoLabel: "GitHub Repo",
        repoUrl: "https://github.com/godstale/Agent-Toolbox/blob/main/README.md",
        blogLabel: "Blog Hub (KR)",
        allCats: (n) => `All (${n})`,
        typeLabel: "Type: ",
        allTypes: "All Types",
        count: (f, t, u) => `Showing ${f} of ${t} tools (Updated: ${u})`,
        empty: "No matching tools found. Try a different keyword.",
        guide: "Guide (KR) ↗",
        open: "Open ↗"
      },
      ko: {
        title: "Agent Toolbox — AI 에이전트 도구·스킬 검색",
        subtitle: "AI 에이전트·스킬·오픈소스·앱 분야별 실시간 검색 카탈로그",
        placeholder: "도구 이름, 설명, 태그, 분야로 검색하세요 (예: Claude Code, MCP, Sprite, OCR, 보안)...",
        repoLabel: "GitHub 저장소 (한글)",
        repoUrl: "https://github.com/godstale/Agent-Toolbox/blob/main/README.ko.md",
        blogLabel: "블로그 총정리 허브",
        allCats: (n) => `전체 (${n})`,
        typeLabel: "유형: ",
        allTypes: "전체 유형",
        count: (f, t, u) => `검색 결과: ${f}개 / 전체 ${t}개 (업데이트: ${u})`,
        empty: "조건에 맞는 도구를 찾지 못했습니다. 다른 키워드로 검색해 보세요.",
        guide: "가이드 ↗",
        open: "열기 ↗"
      }
    };

    const searchInput = document.getElementById("searchInput");
    const categoryFilters = document.getElementById("categoryFilters");
    const typeSelect = document.getElementById("typeSelect");
    const resultCount = document.getElementById("resultCount");
    const grid = document.getElementById("grid");
    const subtitleEl = document.getElementById("subtitle");
    const repoLink = document.getElementById("repoLink");
    const blogLink = document.getElementById("blogLink");
    const typeLabel = document.getElementById("typeLabel");
    const langEnBtn = document.getElementById("langEnBtn");
    const langKoBtn = document.getElementById("langKoBtn");

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function detectInitialLang() {
      const params = new URLSearchParams(window.location.search);
      const urlLang = params.get("lang");
      if (urlLang === "en" || urlLang === "ko") return urlLang;
      const saved = localStorage.getItem("agent_toolbox_lang");
      if (saved === "en" || saved === "ko") return saved;
      const nav = (navigator.language || "en").toLowerCase();
      return nav.startsWith("ko") ? "ko" : "en";
    }

    function applyLangUI() {
      const ui = UI[lang];
      document.documentElement.lang = lang;
      document.title = ui.title;
      subtitleEl.textContent = ui.subtitle;
      searchInput.placeholder = ui.placeholder;
      repoLink.textContent = ui.repoLabel;
      repoLink.href = ui.repoUrl;
      blogLink.textContent = ui.blogLabel;
      typeLabel.textContent = ui.typeLabel;
      langEnBtn.classList.toggle("active", lang === "en");
      langKoBtn.classList.toggle("active", lang === "ko");

      const currentType = selectedType;
      const types = [...new Set(allData.tools.map(t => t.type).filter(Boolean))].sort();
      typeSelect.innerHTML = `<option value="all">${escapeHtml(ui.allTypes)}</option>` +
        types.map(tp => `<option value="${escapeHtml(tp)}">${escapeHtml(tp)}</option>`).join("");
      typeSelect.value = currentType;
    }

    function renderFilters() {
      const ui = UI[lang];
      const catCounts = {};
      allData.tools.forEach(t => {
        catCounts[t.category] = (catCounts[t.category] || 0) + 1;
      });

      const buttons = [
        `<button class="pill ${selectedCat === "all" ? "active" : ""}" data-cat="all">${escapeHtml(ui.allCats(allData.tools.length))}</button>`
      ];
      allData.categories.forEach(c => {
        const cname = lang === "en" ? c.en_name : c.name;
        buttons.push(
          `<button class="pill ${selectedCat === c.id ? "active" : ""}" data-cat="${c.id}">${c.icon} ${escapeHtml(cname)} (${catCounts[c.id] || 0})</button>`
        );
      });
      categoryFilters.innerHTML = buttons.join("");

      categoryFilters.querySelectorAll(".pill").forEach(btn => {
        btn.addEventListener("click", () => {
          selectedCat = btn.dataset.cat;
          renderFilters();
          renderTools();
        });
      });
    }

    function renderTools() {
      const ui = UI[lang];
      const q = searchInput.value.trim().toLowerCase();
      const terms = q ? q.split(/\s+/) : [];
      const catMap = Object.fromEntries(allData.categories.map(c => [c.id, c]));

      const filtered = allData.tools.filter(t => {
        if (selectedCat !== "all" && t.category !== selectedCat) return false;
        if (selectedType !== "all" && t.type !== selectedType) return false;
        if (terms.length === 0) return true;
        const haystack = [
          t.name,
          t.name_en || "",
          t.description,
          t.description_en || "",
          t.url,
          t.subcategory || "",
          t.subcategory_en || "",
          t.type || "",
          catMap[t.category]?.name || "",
          catMap[t.category]?.en_name || "",
          ...(t.tags || [])
        ].join(" ").toLowerCase();
        return terms.every(term => haystack.includes(term));
      });

      resultCount.textContent = ui.count(filtered.length, allData.tools.length, allData.meta.updated_at);

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty">${escapeHtml(ui.empty)}</div>`;
        return;
      }

      grid.innerHTML = filtered.map(t => {
        const displayName = lang === "en" ? (t.name_en || t.name) : t.name;
        const displayDesc = lang === "en" ? (t.description_en || t.description) : t.description;
        const tagsHtml = (t.tags || []).slice(0, 4).map(tag =>
          `<span class="tag" data-tag="${escapeHtml(tag)}">#${escapeHtml(tag)}</span>`
        ).join("");
        const wpLink = t.wp_url ? `<a href="${escapeHtml(t.wp_url)}" target="_blank" rel="noopener">${escapeHtml(ui.guide)}</a>` : "";
        return `
          <article class="card">
            <div>
              <div class="card-top">
                <h2 class="card-title"><a href="${escapeHtml(t.url)}" target="_blank" rel="noopener">${escapeHtml(displayName)}</a></h2>
                <span class="type-badge">${escapeHtml(t.type || "Tool")}</span>
              </div>
              <p class="card-desc">${escapeHtml(displayDesc)}</p>
            </div>
            <div class="card-footer">
              <div class="tags">${tagsHtml}</div>
              <div class="links">
                ${wpLink}
                <a href="${escapeHtml(t.url)}" target="_blank" rel="noopener">${escapeHtml(ui.open)}</a>
              </div>
            </div>
          </article>
        `;
      }).join("");

      grid.querySelectorAll(".tag").forEach(el => {
        el.addEventListener("click", () => {
          searchInput.value = el.dataset.tag;
          renderTools();
          searchInput.focus();
        });
      });
    }

    function setLang(nextLang) {
      lang = nextLang;
      localStorage.setItem("agent_toolbox_lang", lang);
      applyLangUI();
      renderFilters();
      renderTools();
    }

    async function init() {
      lang = detectInitialLang();
      const res = await fetch("tools.json");
      allData = await res.json();

      const params = new URLSearchParams(window.location.search);
      if (params.get("cat")) selectedCat = params.get("cat");
      if (params.get("q")) searchInput.value = params.get("q");

      applyLangUI();
      renderFilters();
      renderTools();
    }

    langEnBtn.addEventListener("click", () => setLang("en"));
    langKoBtn.addEventListener("click", () => setLang("ko"));
    searchInput.addEventListener("input", renderTools);
    typeSelect.addEventListener("change", () => {
      selectedType = typeSelect.value;
      renderTools();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "/" && document.activeElement !== searchInput) {
        e.preventDefault();
        searchInput.focus();
      }
    });

    init().catch(err => {
      resultCount.textContent = "Failed to load data.";
      console.error(err);
    });
  </script>
</body>
</html>
